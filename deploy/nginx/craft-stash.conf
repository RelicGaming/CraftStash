# nginx: a server block for /etc/nginx/conf.d/. Set TRUST_PROXY=1 on the app (and TRUSTED_PROXIES to nginx's address).
# Point the ssl_ lines at your certificate (these are certbot's paths for craft.example.com).
server {
    listen 443 ssl;
    http2 on;
    server_name craft.example.com;
    ssl_certificate     /etc/letsencrypt/live/craft.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/craft.example.com/privkey.pem;

    client_max_body_size 30m;                 # uploads (MAX_UPLOAD_MB is 25 by default)

    location / {
        proxy_pass http://craft-stash:8000;   # or http://<host-ip>:8080 if the app publishes a port
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Sub-path instead: set URL_PREFIX=/craft on the app, and use this in the example.com server block.
    # location /craft/ {
    #     proxy_pass http://craft-stash:8000;  # no trailing slash: the /craft prefix is passed through
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     client_max_body_size 30m;
    #     proxy_read_timeout 120s;
    # }
}

server {
    listen 80;
    server_name craft.example.com;
    return 301 https://$host$request_uri;
}
