# HAProxy 2.8+: TLS on the frontend, Craft Stash behind. Set TRUST_PROXY=1 on the app (and TRUSTED_PROXIES to HAProxy).
global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option forwardfor                         # X-Forwarded-For
    timeout connect 5s
    timeout client 120s
    timeout server 120s

frontend web
    bind :80
    bind :443 ssl crt /etc/haproxy/certs/craft.example.com.pem
    http-request redirect scheme https unless { ssl_fc }
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    http-request deny deny_status 413 if { req.body_size gt 31457280 }   # 30 MB uploads
    use_backend craft-stash if { hdr(host) -i craft.example.com }
    # Sub-path instead (URL_PREFIX=/craft on the app): use_backend craft-stash if { path_beg /craft/ }

backend craft-stash
    server app craft-stash:8000 check inter 30s
    option httpchk GET /healthz
