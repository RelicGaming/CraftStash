## SWAG (linuxserver.io): copy to /config/nginx/proxy-confs/craft-stash.subdomain.conf, put Craft Stash on SWAG's
## Docker network, and set TRUST_PROXY=1 (and TRUSTED_PROXIES to that network) on the app.
## Reached at https://craft.yourdomain.tld (add "craft" to SWAG's SUBDOMAINS).

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name craft.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 30m;

    location / {
        include /config/nginx/proxy.conf;     # sets the X-Forwarded-* headers and timeouts
        include /config/nginx/resolver.conf;
        set $upstream_app craft-stash;        # the container name
        set $upstream_port 8000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
        proxy_read_timeout 120s;
    }
}
