name: Test and build image
on:
  push:
    branches: [main]
    tags: ["v*"]            # a release: v1.0.0, or v1.0.0-rc.1 for a release candidate
  pull_request:
  workflow_dispatch:
permissions:
  contents: read            # the test job runs pull-request code, so it gets read-only access
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres, mariadb]
        python: ["3.15"]        # what the image runs (Dockerfile FROM python:3.15-slim)
        include:
          - {db: sqlite, python: "3.12"}   # the oldest Python the README supports for running from source
    services:
      postgres:                 # used by the postgres leg; the whole suite runs against it (wiped before each test)
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: cstest
          POSTGRES_DB: craftstash
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
      mariadb:                  # used by the mariadb leg
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: cstest
          MARIADB_DATABASE: craftstash
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://postgres:cstest@localhost:5432/craftstash' || matrix.db == 'mariadb' && 'mysql://root:cstest@127.0.0.1:3306/craftstash' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
      - run: python app/selftest.py --out selftest-report
        if: matrix.db == 'sqlite' && matrix.python == '3.15'
      - uses: actions/upload-artifact@v7
        if: always() && matrix.db == 'sqlite' && matrix.python == '3.15'
        with:
          name: selftest-report
          path: selftest-report/
  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # only the job that publishes the image can write to GHCR
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches app/version.py and the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release_notes.py --tag "$GITHUB_REF_NAME" > /dev/null
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # v1.2.3 -> :1.2.3, :1.2, :1 and :latest. A release candidate (v1.2.3-rc.1) gets only :1.2.3-rc.1.
          # Every push to main -> :edge. Every build -> :sha-<commit>, to pin or roll back.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub Release
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/release_notes.py --tag "$GITHUB_REF_NAME" > notes.md
      - name: GitHub Release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "Craft Stash ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag $pre
