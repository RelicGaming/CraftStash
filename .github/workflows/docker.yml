name: Test and build image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read            # the test job runs pull-request code, so it gets read-only access
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:                 # used by the postgres leg; the whole suite runs against it (wiped before each test)
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: cstest
          POSTGRES_DB: craftstash
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://postgres:cstest@localhost:5432/craftstash' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
      - run: python app/selftest.py --out selftest-report
        if: matrix.db == 'sqlite'
      - uses: actions/upload-artifact@v7
        if: always() && matrix.db == 'sqlite'
        with:
          name: selftest-report
          path: selftest-report/
  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # only the job that publishes the image can write to GHCR
    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}       # :latest plus :sha-<commit>, so any earlier build can be pulled back
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
