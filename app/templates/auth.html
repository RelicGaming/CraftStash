{% extends "base.html" %}{% block body %}
<form class="card" method="post" style="max-width:340px;margin:3rem auto">{{ csrf }}
<h2>{{ 'Log in' if mode == 'login' else 'Create account' }}</h2>
<label>Username</label><input name="username" required autofocus autocomplete="username" style="width:100%">
<label>Password</label><input name="password" type="password" required autocomplete="{{ 'current-password' if mode == 'login' else 'new-password' }}" style="width:100%">
<p><button>{{ 'Log in' if mode == 'login' else 'Sign up' }}</button></p>
<p class="mut">{% if mode == 'login' %}{% if can_register %}<a href="{{ url_for('register') }}">Create an account</a>{% endif %}{% else %}<a href="{{ url_for('login') }}">Have an account? Log in</a>{% endif %}</p>
</form>{% endblock %}
